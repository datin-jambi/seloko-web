# Header keamanan yang dipakai di semua `location` yang menambah header sendiri.
# `add_header` TIDAK diwarisi ke blok location yang punya `add_header` — karena
# itu daftar ini di-include di setiap tempat, bukan ditaruh sekali di `server`.
#
# CATATAN: HSTS sengaja belum aktif. Hidupkan (baris di bawah) hanya setelah
# domain dilayani lewat HTTPS — mengirim HSTS di atas HTTP biasa mengunci
# browser ke https dan membuat aplikasi internal tak bisa dibuka.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
